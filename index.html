<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Архив</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- КНОПКА НАСТРОЕК -->
    <div class="settings-menu-container">
        <button class="settings-toggle-btn" id="settingsMenuBtn" title="Настройки">⚙️</button>
        <div class="settings-dropdown" id="settingsDropdown">
            <div class="settings-section-title">Тема</div>
            <button class="settings-option" data-theme-value="default" onclick="setTheme('default')">
                <span class="theme-preview preview-dark"><span class="tp-bg"></span><span class="tp-accent"></span></span>
                Тёмная
            </button>
            <button class="settings-option" data-theme-value="light" onclick="setTheme('light')">
                <span class="theme-preview preview-light"><span class="tp-bg"></span><span class="tp-accent"></span></span>
                Светлая
            </button>
            <button class="settings-option" data-theme-value="dark-blue" onclick="setTheme('dark-blue')">
                <span class="theme-preview preview-blue"><span class="tp-bg"></span><span class="tp-accent"></span></span>
                Тёмно-синяя
            </button>
            <button class="settings-option" data-theme-value="black" onclick="setTheme('black')">
                <span class="theme-preview preview-black"><span class="tp-bg"></span><span class="tp-accent"></span></span>
                Чёрная
            </button>
            <button class="settings-option" data-theme-value="black-red" onclick="setTheme('black-red')">
                <span class="theme-preview preview-black-red"><span class="tp-bg"></span><span class="tp-accent"></span></span>
                Чёрно-красная
            </button>
            <div class="settings-divider"></div>
            <button class="settings-option settings-logout" onclick="logout()">
                🚪 Выйти
            </button>
        </div>
    </div>

    <!-- ЭКРАН ВХОДА -->
    <div id="login">
        <h2>Вход</h2>
        <input type="password" id="password" placeholder="Введите пароль">
        <button onclick="login()">Войти</button>
        <div id="message"></div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div id="content" style="display: none;">
        <h1>Архив</h1>

        <div class="form-container">
            <h2 id="formTitle">Новая запись</h2>
            
            <input type="text" id="title" placeholder="Заголовок">
            <textarea id="contentInput" placeholder="Введите текст..."></textarea>

            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="category" value="Заметки" checked> 📝 Заметки
                </label>
                <label class="radio-label">
                    <input type="radio" name="category" value="Скрипты"> 📜 Скрипты
                </label>
            </div>

            <input type="text" id="robloxUrl" placeholder="Ссылка (необязательно)...">

            <div class="file-upload-wrapper">
                <label class="file-upload-button" for="imageInput">
                    📎 <span id="fileName">Выберите фото</span>
                </label>
                <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
            </div>

            <div class="pin-wrapper">
                <label class="toggle-container">
                    <input type="checkbox" id="isPinned">
                    <span class="toggle-slider"></span>
                    📌 Закрепить запись
                </label>
            </div>

            <div class="actions-wrapper">
                <button class="btn-save" onclick="saveNote()">Сохранить</button>
                <button class="btn-cancel" id="btnCancel" onclick="resetForm()" style="display: none;">Отмена</button>
            </div>
        </div>

        <!-- ПОИСК -->
        <input type="text" id="search" placeholder="Поиск..." oninput="handleSearch()">

        <div class="filters-row">
            <div class="category-filters">
                <button type="button" class="filter-btn active" data-category="all" onclick="setCategory('all', event)">Все</button>
                <button type="button" class="filter-btn" data-category="Заметки" onclick="setCategory('Заметки', event)">📝 Заметки</button>
                <button type="button" class="filter-btn" data-category="Скрипты" onclick="setCategory('Скрипты', event)">📜 Скрипты</button>
            </div>
            <div class="sort-wrap">
                <button type="button" class="sort-trigger" id="sortTrigger" onclick="toggleSortMenu(event)">
                    <span id="sortLabel">Сначала новые</span>
                    <span class="sort-arrow">▾</span>
                </button>
                <div class="sort-menu" id="sortMenu">
                    <button type="button" class="sort-option active" data-sort="newest" onclick="setSort('newest', event)">Сначала новые</button>
                    <button type="button" class="sort-option" data-sort="oldest" onclick="setSort('oldest', event)">Сначала старые</button>
                </div>
            </div>
        </div>

        <div id="notes"></div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПРОСМОТРА -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-body">
                <div class="modal-left" id="modalLeft">
                    <img id="modalImage" src="" alt="Превью">
                </div>
                <div class="modal-right">
                    <h2 id="modalTitle"></h2>
                    <div id="modalRobloxContainer"></div>
                    <div id="modalText"></div>
                    <button class="btn-modal-copy" id="btnModalCopy" onclick="copyModalContent()">
                        📋 Скопировать текст
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ОКНО ПОДТВЕРЖДЕНИЯ УДАЛЕНИЯ -->
    <div class="modal-overlay" id="confirmOverlay">
        <div class="confirm-card">
            <h3>Удалить запись?</h3>
            <p>Это действие нельзя будет отменить.</p>
            <div class="confirm-actions">
                <button class="btn-cancel" onclick="closeConfirmModal()">Отмена</button>
                <button class="btn-delete-confirm" id="btnConfirmDelete">Удалить</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
