<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Блок входа (по умолчанию виден) -->
    <div id="login" class="login-card">
        <input type="password" id="password" placeholder="Введите пароль">
        <button onclick="login()">Войти</button>
        <div id="message"></div>
    </div>

    <!-- Блок контента (скрыт до логина) -->
    <div id="content" style="display: none;">
        <h1>Архив</h1>

        <!-- Форма добавления/редактирования -->
        <div class="form-container">
            <h2 id="formTitle">Новая запись</h2>
            
            <input id="title" type="text" placeholder="Название">
            <textarea id="text" placeholder="Текст записи"></textarea>

            <!-- Выбор категории -->
<div class="category-toggle-group">
    <label class="category-radio">
        <input type="radio" name="category" value="Заметки" checked>
        <span class="radio-tile">📝 Заметки</span>
    </label>
    <label class="category-radio">
        <input type="radio" name="category" value="Скрипты">
        <span class="radio-tile">📜 Скрипты</span>
    </label>
</div>

            <div class="file-upload-wrapper">
                <label class="file-upload-button">
                    <span class="file-icon">🖼️</span>
                    <span id="fileNameText">Прикрепить фото</span>
                    <input type="file" id="imageInput" accept="image/*" onchange="updateFileName(this)">
                </label>
            </div>

            <div class="pin-wrapper">
                <label class="toggle-container">
                    <input type="checkbox" id="isPinned">
                    <span class="toggle-slider"></span>
                    <span>📌 Закрепить запись</span>
                </label>
            </div>

            <div class="actions-wrapper">
                <button class="btn-save" onclick="saveNote()">Сохранить</button>
                <button id="cancelEdit" class="btn-cancel" onclick="cancelEdit()" style="display:none;">Отмена</button>
            </div>
        </div>

        <!-- Поиск -->
        <input id="search" type="text" placeholder="Поиск записей..." oninput="searchNotes()">

        <!-- Фильтры категорий -->
        <div class="category-filters">
            <button class="filter-btn active" onclick="filterByCategory('all', this)">Все</button>
            <button class="filter-btn" onclick="filterByCategory('Заметки', this)">📝 Заметки</button>
            <button class="filter-btn" onclick="filterByCategory('Скрипты', this)">📜 Скрипты</button>
        </div>

        <!-- Сетка заметок -->
        <div id="notes"></div>
    </div>

    <!-- Модальное окно просмотра -->
    <div id="noteModal" class="modal-overlay" onclick="closeNoteModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeNoteModal()">✕</button>
            <div class="modal-body">
                <div class="modal-left" id="modalImageContainer"></div>
                <div class="modal-right">
                    <div id="modalPinBadge"></div>
                    <h2 id="modalTitle"></h2>
                    <div id="modalText"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
