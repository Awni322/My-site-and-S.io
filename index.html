<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-игры и Панель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Модальное окно для ввода ника при первом входе -->
    <div id="nicknameModal" class="modal-overlay">
        <div class="modal-card">
            <h2>Привет! Представься 👋</h2>
            <p>Введи свой никнейм, чтобы сохранять результаты и выигрыши в игре.</p>
            <input type="text" id="nicknameInput" class="modal-input" placeholder="Твой никнейм..." maxlength="20">
            <button id="saveNicknameBtn" class="game-btn">Сохранить</button>
        </div>
    </div>

    <!-- Боковые стрелки -->
    <button class="side-arrow side-arrow-right" id="sideArrowRight" title="Открыть панель игр">‹</button>

    <!-- Основной контент страницы -->
    <div class="main-container">
        <h1>Главная страница</h1>

        <!-- Блок настроек (смена ника) -->
        <div class="settings-section">
            <h3>Профиль</h3>
            <div class="guess-input-row">
                <input type="text" id="changeNicknameInput" placeholder="Новый ник..." maxlength="20">
                <button id="changeNicknameBtn" class="game-btn game-btn-inline">Сменить ник</button>
            </div>
            <p class="game-hint">Текущий ник: <strong id="currentNicknameDisplay">—</strong></p>
        </div>
    </div>

    <!-- Выдвижная панель мини-игр -->
    <div class="games-panel" id="gamesPanel">
        <button class="side-arrow side-arrow-left" id="sideArrowLeft" title="Закрыть панель">›</button>

        <div class="games-panel-inner">
            <h1 class="games-title">Игровой Центр</h1>

            <div class="games-grid">
                <!-- Игра 1: Колесо Фортуны -->
                <div class="game-card">
                    <h2>Колесо Фортуны</h2>
                    <div class="wheel-wrapper">
                        <div class="wheel-pointer"></div>
                        <canvas id="wheelCanvas" width="280" height="280"></canvas>
                    </div>
                    <button id="spinBtn" class="game-btn">Крутить колесо!</button>
                    <div id="wheelResult" class="game-result"></div>

                    <!-- Статистика выигрышей -->
                    <div class="wheel-stats-container">
                        <h4>📜 История выигрышей</h4>
                        <ul id="wheelStatsList" class="stats-list">
                            <!-- Записи добавляются скриптом -->
                        </ul>
                        <button id="clearWheelStatsBtn" class="game-btn-secondary">Очистить историю</button>
                    </div>
                </div>

                <!-- Игра 2: Крестики-Нолики -->
                <div class="game-card">
                    <h2>Крестики-Нолики</h2>
                    <div class="ttt-board" id="tttBoard"></div>
                    <div id="tttResult" class="game-result">Ваш ход (X)</div>
                    <button id="tttResetBtn" class="game-btn">Перезапустить</button>
                </div>

                <!-- Игра 3: Угадай число -->
                <div class="game-card">
                    <h2>Угадай число (1-100)</h2>
                    <p class="game-hint">Я загадал число от 1 до 100. Попробуй угадать!</p>
                    <div class="guess-input-row">
                        <input type="number" id="guessInput" placeholder="1-100" min="1" max="100">
                        <button id="guessBtn" class="game-btn game-btn-inline">Проверить</button>
                    </div>
                    <div id="guessResult" class="game-result"></div>
                    <button id="guessResetBtn" class="game-btn" style="margin-top: 10px;">Новая игра</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
