<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Архив</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Меню смены темы (справа сверху) -->
    <div class="theme-menu-container">
        <button class="theme-toggle-btn" id="themeMenuBtn" title="Выбрать тему">🎨</button>
        <div class="theme-dropdown" id="themeDropdown">
            <button class="theme-option" onclick="setTheme('default')">
                <span class="theme-preview-dot" style="background: #0b130f;"></span>
                Хакерская
            </button>
            <button class="theme-option" onclick="setTheme('light')">
                <span class="theme-preview-dot" style="background: #ffffff;"></span>
                Светлая
            </button>
            <button class="theme-option" onclick="setTheme('dark-blue')">
                <span class="theme-preview-dot" style="background: #0f172a;"></span>
                Тёмно-синяя
            </button>
        </div>
    </div>

    <!-- ЭКРАН ВХОДА -->
    <div id="login">
        <h2>Вход</h2>
        <input type="password" id="password" placeholder="Введите пароль">
        <button onclick="login()">Войти</button>
        <div id="message"></div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div id="content" style="display: none;">
        <h1>Архив</h1>

        <div class="form-container">
            <h2 id="formTitle">Новая запись</h2>
            
            <input type="text" id="title" placeholder="Заголовок">
            <textarea id="contentInput" placeholder="Введите текст..."></textarea>

            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="category" value="Заметки" checked> 📝 Заметки
                </label>
                <label class="radio-label">
                    <input type="radio" name="category" value="Скрипты"> 📜 Скрипты
                </label>
            </div>

            <input type="text" id="robloxUrl" placeholder="Ссылка (необязательно)...">

            <div class="file-upload-wrapper">
                <label class="file-upload-button" for="imageInput">
                    📎 <span id="fileName">Выберите фото</span>
                </label>
                <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
            </div>

            <div class="pin-wrapper">
                <label class="toggle-container">
                    <input type="checkbox" id="isPinned">
                    <span class="toggle-slider"></span>
                    📌 Закрепить запись
                </label>
            </div>

            <div class="actions-wrapper">
                <button class="btn-save" onclick="saveNote()">Сохранить</button>
                <button class="btn-cancel" id="btnCancel" onclick="resetForm()" style="display: none;">Отмена</button>
            </div>
        </div>

        <!-- ПОИСК -->
        <input type="text" id="search" placeholder="Поиск..." oninput="handleSearch()">

        <div class="category-filters">
            <button class="filter-btn active" onclick="filterCategory('all', event)">Все</button>
            <button class="filter-btn" onclick="filterCategory('Заметки', event)">📝 Заметки</button>
            <button class="filter-btn" onclick="filterCategory('Скрипты', event)">📜 Скрипты</button>
        </div>

        <div id="notes"></div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПРОСМОТРА -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-body">
                <div class="modal-left" id="modalLeft">
                    <img id="modalImage" src="" alt="Превью">
                </div>
                <div class="modal-right">
                    <h2 id="modalTitle"></h2>
                    <div id="modalRobloxContainer"></div>
                    <div id="modalText"></div>
                    <button class="btn-modal-copy" id="btnModalCopy" onclick="copyModalContent()">
                        📋 Скопировать текст
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ОКНО ПОДТВЕРЖДЕНИЯ УДАЛЕНИЯ -->
    <div class="modal-overlay" id="confirmOverlay">
        <div class="confirm-card">
            <h3>Удалить запись?</h3>
            <p>Это действие нельзя будет отменить.</p>
            <div class="confirm-actions">
                <button class="btn-cancel" onclick="closeConfirmModal()">Отмена</button>
                <button class="btn-delete-confirm" id="btnConfirmDelete">Удалить</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
